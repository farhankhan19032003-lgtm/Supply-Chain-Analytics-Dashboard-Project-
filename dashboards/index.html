<title>Supply Chain Dashboards</title>

      --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;

    }

    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);

    --good:#0ca30c;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--page); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }

  header h1 { font-size:22px; margin:0 0 4px; font-weight:650; }
  header p { margin:0; color:var(--ink2); }
  .note { margin-top:8px; padding:8px 12px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink2); font-size:13px; }
  nav { display:flex; gap:6px; flex-wrap:wrap; margin:18px 0 14px; }
  nav button { font:inherit; color:var(--ink2); background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 14px; cursor:pointer; }

  .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:14px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; min-width:0; }
  .c3 { grid-column:span 3; } .c4 { grid-column:span 4; } .c5 { grid-column:span 5; } .c6 { grid-column:span 6; } .c7 { grid-column:span 7; } .c8 { grid-column:span 8; } .c12 { grid-column:span 12; }
  @media (max-width:900px) { .c3,.c4,.c5,.c6,.c7,.c8 { grid-column:span 12; } .c3 { grid-column:span 6; } }
  .card h2 { font-size:14px; margin:0 0 2px; font-weight:650; }
  .card .sub { color:var(--ink2); font-size:12.5px; margin:0 0 8px; }
  .tile .v { font-size:30px; font-weight:650; line-height:1.15; }
  .tile .l { color:var(--ink2); font-size:13px; }
  .tile .d { color:var(--muted); font-size:12px; margin-top:2px; }
  svg { width:100%; height:auto; display:block; overflow:visible; }
  svg text { font:11.5px system-ui,-apple-system,"Segoe UI",sans-serif; fill:var(--ink2); }
  svg .lab { fill:var(--ink); }
  svg .mut { fill:var(--muted); }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--ink2); margin:4px 0 6px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; color:var(--ink2); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--axis); position:sticky; top:0; background:var(--surface); }
  td { padding:6px 8px; border-bottom:1px solid var(--grid); }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .scroll { max-height:380px; overflow:auto; }
  body.full .scroll { max-height:none; overflow:visible; }
  .pill { display:inline-block; white-space:nowrap; padding:1px 8px; border-radius:99px; font-size:11.5px; border:1px solid var(--border); }
  .pill b { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
  #tip { position:fixed; z-index:10; pointer-events:none; background:var(--ink); color:var(--page); padding:6px 9px; border-radius:6px; font-size:12px; max-width:260px; opacity:0; transition:opacity .08s; white-space:pre-line; }
  .alert { display:flex; gap:8px; align-items:flex-start; padding:10px 12px; border-radius:8px; border:1px solid var(--st-stockout); background:var(--surface); margin-bottom:14px; }
  .alert b { color:var(--st-stockout); }
  [hidden] { display:none !important; }
  .pt { font-size:18px; margin:0 0 10px; }
  @media print {
    @page { size: A3 landscape; margin: 10mm; }
    body { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .pg { break-before:page; } .pg:first-child { break-before:auto; }
    .card { break-inside:avoid; } .scroll { max-height:none; overflow:visible; }
    .wrap { max-width:none; padding:0; }
  }
</style>

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const f1 = v => Number(v).toFixed(1), f2 = v => Number(v).toFixed(2);
const nf = v => Number(v).toLocaleString('en-IN');
const tip = t => `data-tip="${esc(t)}"`;
const SER = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)'];
const STC = { STOCKOUT:'var(--st-stockout)', CRITICAL:'var(--st-critical)', LOW:'var(--st-low)', HEALTHY:'var(--st-healthy)', EXCESS:'var(--st-excess)' };
const svg = (w, h, inner, label) => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">${inner}</svg>`;
const legend = items => `<div class="legend">${items.map(([c, n]) => `<span><i style="background:${c}"></i>${esc(n)}</span>`).join('')}</div>`;
const card = (cls, title, sub, body) => `<section class="card ${cls}"><h2>${esc(title)}</h2>${sub ? `<p class="sub">${esc(sub)}</p>` : ''}${body}</section>`;
const tile = (v, l, d) => `<section class="card tile c3"><div class="l">${esc(l)}</div><div class="v">${v}</div><div class="d">${esc(d)}</div></section>`;

function hbar(rows, o = {}) {           // rows: {label, value, color, tip, text}
  const rh = 26, left = o.left || 130, w = 560, right = 70, top = 4, h = rows.length * rh + top + 4;
  const max = o.max || Math.max(...rows.map(r => r.value)) * 1.02 || 1;
  let s = '';
  rows.forEach((r, i) => {
    const y = top + i * rh, bw = Math.max(0, (w - left - right) * r.value / max);
    s += `<g ${tip(r.tip || `${r.label}: ${r.text}`)}><rect x="0" y="${y}" width="${w}" height="${rh}" fill="transparent"/>
      <text x="${left - 8}" y="${y + 17}" text-anchor="end">${esc(r.label)}</text>
      <path d="M${left} ${y + 5}h${Math.max(0, bw - 4)}a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-${Math.max(0, bw - 4)}z" style="fill:${r.color || 'var(--s1)'}"/>
      <text class="lab" x="${left + bw + 6}" y="${y + 17}">${esc(r.text)}</text></g>`;
  });
  s += `<line x1="${left}" x2="${left}" y1="${top}" y2="${h - 4}" style="stroke:var(--axis)"/>`;
  return svg(w, h, s, o.label || 'bar chart');
}

function pairedBars(rows) {             // rows: {label, a, b}
  const rh = 30, left = 110, w = 560, right = 50, h = rows.length * rh + 6;
  const max = Math.max(...rows.flatMap(r => [r.a, r.b])) * 1.05;
  let s = '';
  rows.forEach((r, i) => {
    const y = 4 + i * rh, sc = v => (w - left - right) * v / max;
    s += `<g ${tip(`${r.label}\nStock share ${f1(r.a)}%\nDemand share ${f1(r.b)}%`)}><rect x="0" y="${y}" width="${w}" height="${rh}" fill="transparent"/>
      <text x="${left - 8}" y="${y + 16}" text-anchor="end">${esc(r.label)}</text>
      <rect x="${left}" y="${y + 3}" width="${sc(r.a)}" height="10" rx="3" style="fill:var(--s1)"/>
      <rect x="${left}" y="${y + 15}" width="${sc(r.b)}" height="10" rx="3" style="fill:var(--s2)"/>
      <text class="lab" x="${left + sc(r.a) + 5}" y="${y + 12}">${f1(r.a)}%</text>
      <text class="lab" x="${left + sc(r.b) + 5}" y="${y + 24}">${f1(r.b)}%</text></g>`;
  });
  return svg(w, h, s, 'Stock share versus demand share by warehouse');
}

function line(pts, o = {}) {            // pts: {x, y}
  const w = 640, h = o.h || 230, L = 42, R = 12, T = 10, B = 30;
  const ys = pts.map(p => p.y), lo = o.lo ?? Math.floor(Math.min(...ys) - 1), hi = o.hi ?? Math.ceil(Math.max(...ys) + 1);
  const X = i => L + (w - L - R) * i / (pts.length - 1), Y = v => T + (h - T - B) * (1 - (v - lo) / (hi - lo));
  let s = '';
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4, y = Y(v);
    s += `<line x1="${L}" x2="${w - R}" y1="${y}" y2="${y}" style="stroke:var(--grid)"/><text class="mut" x="${L - 6}" y="${y + 4}" text-anchor="end">${f1(v)}${o.unit || ''}</text>`;
  }
  if (o.band) o.band.forEach(([a, b, name]) => {
    const cwb = (w - L - R) / (pts.length - 1); s += `<rect x="${X(a) - cwb / 2}" y="${T}" width="${cwb * (b - a + 1)}" height="${h - T - B}" style="fill:var(--s4);opacity:.22"><title>${esc(name)}</title></rect>`;
  });
  s += `<path d="${pts.map((p, i) => `${i ? 'L' : 'M'}${X(i)} ${Y(p.y)}`).join('')}" fill="none" stroke-width="2" stroke-linejoin="round" style="stroke:${o.color || 'var(--s1)'}"/>`;
  const step = Math.ceil(pts.length / 8);
  pts.forEach((p, i) => {
    if (i % step === 0) s += `<text class="mut" x="${X(i)}" y="${h - 10}" text-anchor="middle">${esc(String(p.x).slice(o.cut || 0))}</text>`;
    const cw = (w - L - R) / pts.length;
    s += `<rect x="${X(i) - cw / 2}" y="${T}" width="${cw}" height="${h - T - B}" fill="transparent" ${tip(`${p.x}\n${f2(p.y)}${o.unit || ''}`)}/>`;
  });
  return svg(w, h, s, o.label || 'line chart');
}

function stackedCols(cats, series, names) {
  const w = 640, h = 250, L = 42, R = 8, T = 10, B = 30;
  const tot = cats.map((_, i) => series.reduce((a, s) => a + s[i], 0)), max = Math.max(...tot) * 1.05;
  const cw = (w - L - R) / cats.length, bw = cw * 0.68, Y = v => T + (h - T - B) * (1 - v / max);
  let s = '';
  for (let k = 0; k <= 4; k++) {
    const v = max * k / 4, y = Y(v);
    s += `<line x1="${L}" x2="${w - R}" y1="${y}" y2="${y}" style="stroke:var(--grid)"/><text class="mut" x="${L - 6}" y="${y + 4}" text-anchor="end">${f1(v)}</text>`;
  }
  cats.forEach((c, i) => {
    let acc = 0; const x = L + i * cw + (cw - bw) / 2;
    series.forEach((sr, k) => {
      const v = sr[i], y1 = Y(acc + v), y0 = Y(acc);
      if (v > 0) s += `<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(0, y0 - y1 - 1)}" style="fill:${SER[k]}" ${tip(`${c}\n${names[k]}: ${f2(v)} Cr`)}/>`;
      acc += v;
    });
    if (i % 3 === 0) s += `<text class="mut" x="${x + bw / 2}" y="${h - 10}" text-anchor="middle">${c.slice(2)}</text>`;
  });
  return svg(w, h, s, 'Monthly lost revenue by cause, stacked');
}

function scatter(pts, o) {              // pts: {x, y, r, label, color, tip}
  const w = 640, h = o.h || 300, L = 48, R = 20, T = 12, B = 38;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const xr = Math.max(...xs) - Math.min(...xs) || 1, yr = Math.max(...ys) - Math.min(...ys) || 1, px = xr * (o.padx ?? 0.08), py = yr * 0.08;
  const x0 = o.x0 ?? Math.min(...xs) - px, x1 = o.x1 ?? Math.max(...xs) + px * (o.padr ?? 1);
  const y0 = o.y0 ?? Math.min(...ys) - py, y1 = o.y1 ?? Math.max(...ys) + py;
  const X = v => L + (w - L - R) * (v - x0) / (x1 - x0), Y = v => T + (h - T - B) * (1 - (v - y0) / (y1 - y0));
  let s = '';
  for (let k = 0; k <= 4; k++) {
    const vy = y0 + (y1 - y0) * k / 4, vx = x0 + (x1 - x0) * k / 4;
    s += `<line x1="${L}" x2="${w - R}" y1="${Y(vy)}" y2="${Y(vy)}" style="stroke:var(--grid)"/><text class="mut" x="${L - 6}" y="${Y(vy) + 4}" text-anchor="end">${f1(vy)}</text>`;
    s += `<text class="mut" x="${X(vx)}" y="${h - 20}" text-anchor="middle">${f1(vx)}</text>`;
  }
  if (o.ref) s += `<line x1="${X(Math.max(x0, y0))}" y1="${Y(Math.max(x0, y0))}" x2="${X(Math.min(x1, y1))}" y2="${Y(Math.min(x1, y1))}" stroke-dasharray="4 4" style="stroke:var(--muted)"/>`;
  s += `<text x="${(L + w - R) / 2}" y="${h - 4}" text-anchor="middle">${esc(o.xl)}</text>`;
  s += `<text x="12" y="${(T + h - B) / 2}" text-anchor="middle" transform="rotate(-90 12 ${(T + h - B) / 2})">${esc(o.yl)}</text>`;
  pts.forEach(p => {
    s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${p.r || 6}" style="fill:${p.color || 'var(--s1)'};fill-opacity:.85;stroke:var(--surface);stroke-width:2" ${tip(p.tip)}/>`;
    if (p.label) { const left = X(p.x) > w - 90; s += `<text class="lab" x="${left ? X(p.x) - (p.r || 6) - 4 : X(p.x) + (p.r || 6) + 4}" y="${Y(p.y) + 4}" text-anchor="${left ? 'end' : 'start'}">${esc(p.label)}</text>`; }
  });
  return svg(w, h, s, o.label || 'scatter chart');
}

function heatmap() {
  const cw = 80, ch = 28, left = 100, top = 50, w = left + cw * D.cats.length + 4, h = top + ch * D.heat_wh.length + 6;
  const ramp = ['var(--q100)', 'var(--q250)', 'var(--q400)', 'var(--q550)', 'var(--q700)'];
  let s = '';
  D.cats.forEach((c, j) => {
    const ws = c.replace(' & ', ' &').split(/[ ]/).filter(Boolean), half = Math.ceil(ws.length / 2);
    [ws.slice(0, half).join(' '), ws.slice(half).join(' ')].forEach((t, k) => { s += `<text class="mut" x="${left + j * cw + cw / 2}" y="${top - 24 + k * 13}" text-anchor="middle">${esc(t)}</text>`; });
  });
  D.heat_wh.forEach((n, i) => {
    s += `<text x="${left - 8}" y="${top + i * ch + 18}" text-anchor="end">${esc(n.replace(' DC', ''))}</text>`;
    D.heat[i].forEach((v, j) => {
      const idx = v == null ? 0 : Math.min(4, Math.floor(v / 12.5)), dark = idx >= 2;
      s += `<g ${tip(`${n} / ${D.cats[j]}\nDeficit lines: ${v == null ? 'n/a' : f1(v) + '%'}`)}>
        <rect x="${left + j * cw + 1}" y="${top + i * ch + 1}" width="${cw - 2}" height="${ch - 2}" rx="3" style="fill:${ramp[idx]}"/>
        <text x="${left + j * cw + cw / 2}" y="${top + i * ch + 18}" text-anchor="middle" style="fill:${dark ? '#fff' : '#0b0b0b'}">${v == null ? '–' : Math.round(v) + '%'}</text></g>`;
    });
  });
  return svg(w, h, s, 'Heatmap of deficit lines percent, warehouse by category');
}

function statusMix() {
  const rh = 34, left = 70, w = 560, right = 20, h = D.regions.length * rh + 8;
  let s = '';
  D.regions.forEach((rg, i) => {
    const tot = D.statuses.reduce((a, st) => a + D.mix[st][i], 0), y = 4 + i * rh;
    s += `<text x="${left - 8}" y="${y + 20}" text-anchor="end">${esc(rg)}</text>`;
    let x = left;
    D.statuses.forEach(st => {
      const v = D.mix[st][i], bw = (w - left - right) * v / tot;
      if (v) {
        s += `<rect x="${x}" y="${y + 4}" width="${Math.max(0, bw - 2)}" height="22" rx="3" style="fill:${STC[st]}" ${tip(`${rg}\n${st}: ${v} lines (${f1(v / tot * 100)}%)`)}/>`;
        if (bw > 34) s += `<text x="${x + bw / 2 - 1}" y="${y + 19}" text-anchor="middle" style="fill:${st === 'LOW' ? '#0b0b0b' : '#fff'}">${v}</text>`;
      }
      x += bw;
    });
  });
  return svg(w, h, s, 'Stock status mix by region');
}

function table(cols, rows, num = []) {
  return `<div class="scroll"><table><thead><tr>${cols.map((c, i) => `<th class="${num.includes(i) ? 'n' : ''}">${esc(c)}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r => `<tr>${r.map((c, i) => `<td class="${num.includes(i) ? 'n' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const pill = (t, c) => `<span class="pill"><b style="background:${c}"></b>${esc(t)}</span>`;
const sevColor = s => s === 'CRITICAL' ? 'var(--st-stockout)' : 'var(--st-low)';

/* ---------- dashboards ---------- */
function d1() {
  const wh = D.wh, bad = wh.filter(w => w.lost_pct > 5).length;
  const bars = [...wh].sort((a, b) => b.lost_pct - a.lost_pct).map(w => ({
    label: w.name.replace(' DC', ''), value: w.lost_pct, text: f1(w.lost_pct) + '%', color: w.lost_pct > 5 ? 'var(--s2)' : 'var(--s1)',
    tip: `${w.name}\nDemand lost to stock-outs: ${f2(w.lost_pct)}%\nLost revenue: ${f2(w.lost_cr)} Cr` }));
  const paired = [...wh].sort((a, b) => b.stock_share - a.stock_share).map(w => ({ label: w.name.replace(' DC', ''), a: w.stock_share, b: w.demand_share }));
  const lon = wh.map(w => w.lon), lat = wh.map(w => w.lat);
  const pts = wh.map(w => ({ x: w.lon, y: w.lat, r: 5 + w.stock_cr / 1.2, label: w.name.replace(' DC', ''),
    color: w.deficit_pct > 25 ? 'var(--s2)' : 'var(--s1)',
    tip: `${w.name}\nStock ${f1(w.stock_cr)} Cr\nDeficit lines ${f1(w.deficit_pct)}%` }));
  const weeklyPts = D.weekly;
  const fest = [];
  return `<div class="alert"><b>⚠ ${D.deficit}</b><span>SKU lines are in deficit (${f1(D.deficit / D.lines * 100)}% of ${nf(D.lines)} lines) in the latest week, and
    <b>${D.overdue_n}</b> purchase orders are overdue.</span></div>
  <div class="grid">
    ${tile(f2(D.fill) + '%', 'Network fill rate', '104 weeks')}
    ${tile('₹' + D.lost_cr + ' Cr', 'Revenue lost to stock-outs', '104 weeks')}
    ${tile('₹' + D.stock_cr + ' Cr', 'Stock value', 'latest week, ' + D.asof)}
    ${tile(D.deficit, 'Deficit lines', 'stock-out, critical or low, latest week')}
    ${card('c6', 'Where the stock sits', 'Bubble size = stock value, orange = more than 25% of lines in deficit. Positions follow longitude and latitude.', scatter(pts, { xl: 'Longitude', yl: 'Latitude', h: 330, label: 'Warehouse map' }))}
    ${card('c6', 'Demand lost to stock-outs', 'Share of demand not served, by warehouse. Orange = above 5%.', hbar(bars, { label: 'Demand lost by warehouse' }))}
    ${card('c6', 'Stock share vs demand share', 'Bhiwandi and Gurugram hold far more stock than their demand needs.', legend([['var(--s1)', 'Share of network stock'], ['var(--s2)', 'Share of network demand']]) + pairedBars(paired))}
    ${card('c6', 'Weekly network fill rate', 'Dips show festive peaks and supplier delays.', line(weeklyPts, { unit: '%', label: 'Weekly fill rate', lo: Math.floor(Math.min(...weeklyPts.map(p => p.y)) - 1), hi: 100 }))}
  </div>`;
}

function d2() {
  const legendItems = D.statuses.map(s => [STC[s], s]);
  const rows = D.actions.map(a => [esc(a[0].replace(' DC', '')), esc(a[1]), pill(a[2], STC[a[2]]), f1(a[3]), nf(a[4]), nf(a[5]), esc(a[6].toLowerCase()), f1(a[7])]);
  return `<div class="grid">
    ${card('c7', 'Deficit lines by warehouse and category', 'Share of SKU lines that are stock-out, critical or low (latest week). Darker = worse.', heatmap())}
    ${card('c5', 'Status mix by region', 'Number of SKU lines per status, latest week.', legend(legendItems) + statusMix())}
    ${card('c12', 'Action list: biggest weekly margin at risk', 'Top 25 of ' + D.deficit + ' deficit lines. Margin at risk in ₹ thousand per week.',
      table(['Warehouse', 'SKU', 'Status', 'Weeks of cover', 'Closing stock', 'Inbound open qty', 'Inbound risk', 'Margin at risk (₹k/wk)'], rows, [3, 4, 5, 7]))}
  </div>`;
}

function d3() {
  const bars = D.suppliers.map(s => ({ label: s.name.slice(0, 30), value: s.ontime, text: f1(s.ontime) + '%', color: s.ontime < 55 ? 'var(--s2)' : 'var(--s1)',
    tip: `${s.name} (${s.tier})\nOn-time ${f1(s.ontime)}%\nOverdue open POs: ${s.overdue}` }));
  const mths = D.ontime_m;
  const band = []; mths.forEach((m, i) => { const mo = +m.x.slice(5, 7); if (mo >= 7 && mo <= 9) band.push([i, i, 'Monsoon months']); });
  const pts = D.leadtime.map(l => ({ x: l.x, y: l.y, r: 4 + l.v / 25, color: l.y - l.x > 4 ? 'var(--s2)' : 'var(--s1)',
    tip: `${l.name}\nPromised ${l.x} days\nActual ${l.y} days\nPO value ${l.v} Cr` }));
  const rows = D.overdue.map(o => [esc(o[0]), esc(o[1]), esc(o[2].replace(' DC', '')), esc(o[3]), o[4], f1(o[5]), pill(o[6], sevColor(o[6]))]);
  return `<div class="grid">
    ${tile(D.overdue_n, 'Overdue purchase orders', D.overdue_crit + ' critical')}
    ${tile('₹' + D.overdue_val + ' Cr', 'Value of overdue POs', 'open and past promise date')}
    ${tile(f1(Math.min(...D.suppliers.map(s => s.ontime))) + '%', 'Worst supplier on-time', D.suppliers[0].name)}
    ${tile(D.suppliers.filter(s => s.ontime < 55).length, 'Suppliers under 55% on-time', 'of ' + D.suppliers.length)}
    ${card('c6', 'Supplier on-time delivery', 'Received POs delivered on or before the promised date. Orange = below 55%.', hbar(bars, { left: 200, label: 'On-time by supplier' }))}
    ${card('c6', 'On-time % by month received', 'Shaded months are the monsoon quarter (Jul-Sep). Partial first and last months are excluded.', line(mths, { unit: '%', lo: 40, hi: 100, band, h: 330, label: 'Monthly on-time rate' }))}
    ${card('c6', 'Promised vs actual lead time', 'Average days from order to receipt by supplier. Dashed line = on time; orange = more than 4 days late on average.', scatter(pts, { xl: 'Promised lead time (days)', yl: 'Actual lead time (days)', ref: true, label: 'Lead time scatter', x0: 6, x1: 26, y0: 6, y1: 30 }))}
    ${card('c6', 'Most overdue purchase orders', 'Top 25 of ' + D.overdue_n + ' by days overdue. PO value in ₹ lakh.',
      table(['PO', 'Supplier', 'Warehouse', 'SKU', 'Days', 'Value (₹L)', 'Severity'], rows, [4, 5]))}
  </div>`;
}

function d4() {
  const names = D.causes.map(c => c.name);
  const cbars = D.causes.map((c, i) => ({ label: c.name.replace(/ \(.*\)/, ''), value: c.cr, text: f1(c.cr) + ' Cr (' + f1(c.pct) + '%)', color: SER[i],
    tip: `${c.name}\n${f2(c.cr)} Cr lost revenue\n${f1(c.pct)}% of total` }));
  const ex = D.excess.map(e => ({ label: e.name.replace(' DC', ''), value: e.cr, text: f2(e.cr) + ' Cr', color: e.pct > 30 ? 'var(--s2)' : 'var(--s1)',
    tip: `${e.name}\nAbove target cover: ${f2(e.cr)} Cr\n${f1(e.pct)}% of its stock` }));
  const idle = [...D.assets].sort((a, b) => b.idle_cr - a.idle_cr).map(a => ({ label: a.name.replace(' DC', ''), value: a.idle_cr, text: f2(a.idle_cr) + ' Cr',
    color: a.surplus >= 8 ? 'var(--s2)' : 'var(--s1)', tip: `${a.name}\nIdle cost ${f2(a.idle_cr)} Cr\nSurplus assets ${a.surplus}` }));
  const apts = D.assets.map(a => ({ x: a.util, y: a.down, r: 4 + a.idle_cr * 1.6, label: (a.util < 50 || a.down > 6 || a.util > 85) ? a.name.replace(' DC', '') : '',
    color: a.surplus >= 8 ? 'var(--s2)' : 'var(--s1)', tip: `${a.name}\nUtilisation ${f1(a.util)}%\nDowntime ${f1(a.down)}%\nIdle cost ${f2(a.idle_cr)} Cr` }));
  const rows = D.transfers.map(t => [esc(t[0]), esc(t[1].replace(' DC', '')), esc(t[2].replace(' DC', '')), nf(t[3]), pill(t[4], STC[t[4]] || 'var(--muted)'), f2(t[5])]);
  return `<div class="grid">
    ${card('c6', 'Why sales were lost', 'Lost revenue by primary root cause, 104 weeks.', cbars.length ? hbar(cbars, { left: 190, label: 'Lost revenue by cause' }) : '')}
    ${card('c6', 'Lost revenue by month and cause', '₹ crore. Festive peak and monsoon supplier delays are visible.', legend(names.map((n, i) => [SER[i], n])) + stackedCols(D.rca_months, D.rca_series, names))}
    ${card('c6', 'Stock above target cover', 'Value held beyond 4 weeks of demand, ₹ crore. Orange = more than 30% of the site\'s stock.', hbar(ex, { label: 'Excess stock by warehouse' }))}
    ${card('c6', 'Asset utilisation vs downtime', 'Bubble size = idle cost; orange = 8 or more surplus assets.', scatter(apts, { xl: 'Utilisation %', yl: 'Downtime %', label: 'Asset utilisation scatter', h: 320 }))}
    ${card('c6', 'Idle asset cost by warehouse', '₹ crore over 24 months.', hbar(idle, { label: 'Idle cost by warehouse' }))}
    ${card('c6', 'Recommended stock transfers', `${D.tr_all.n} lines, ${nf(D.tr_all.units)} units, about ₹${D.tr_all.benefit_l} lakh net benefit (indicative). Top 15:`,
      table(['SKU', 'From', 'To', 'Units', 'Receiver', 'Net benefit (₹L)'], rows, [3, 5]))}
  </div>`;
}

/* ---------- shell ---------- */
const TABS = [['Executive Overview', d1], ['Inventory Health & Alerts', d2], ['Pipeline & Suppliers', d3], ['Root Cause & Waste', d4]];
function show(i) {
  $('#main').innerHTML = TABS[i][1]();
  document.querySelectorAll('#tabs button[data-i]').forEach(b => b.setAttribute('aria-selected', String(+b.dataset.i === i)));
  try { localStorage.setItem('scTab', i); } catch (e) {}
}
$('#asof').textContent = `As of week ending ${D.asof} · 12 warehouses · 120 SKUs · 104 weeks`;
$('#tabs').innerHTML = TABS.map((t, i) => `<button role="tab" data-i="${i}">${esc(t[0])}</button>`).join('') +
  '<span class="sp"></span><button id="theme" aria-label="Toggle dark mode">Dark / light</button>';
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'theme') {
    const r = document.documentElement, dark = getComputedStyle(r).colorScheme === 'dark';
    r.setAttribute('data-theme', dark ? 'light' : 'dark');
  } else show(+b.dataset.i);
});
const tipEl = $('#tip');
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (t) { tipEl.textContent = t.dataset.tip; tipEl.style.opacity = 1; } });
document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) tipEl.style.opacity = 0; });
document.addEventListener('mousemove', e => { tipEl.style.left = Math.min(e.clientX + 14, innerWidth - 270) + 'px'; tipEl.style.top = (e.clientY + 14) + 'px'; });
if (location.hash === '#print') {
  $('#tabs').hidden = true;
  $('#main').innerHTML = TABS.map((t, i) => `<div class="pg"><h2 class="pt">${i + 1}. ${esc(t[0])}</h2>${t[1]()}</div>`).join('');
  throw 0;
}
let start = 0; try { start = +localStorage.getItem('scTab') || 0; } catch (e) {}
if (/^#tab=\d/.test(location.hash)) start = +location.hash.slice(5, 6);
if (location.hash.includes('full')) document.body.classList.add('full');
show(start < TABS.length ? start : 0);
</script>
